name: Build iOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [tools/**, convert/**, .github/workflows/convert-net.yml]
  pull_request:
  workflow_dispatch:
    inputs:
      lc0_ref:
        description: lc0 branch or tag to build
        default: release/0.33
      ort_version:
        description: ONNX Runtime version for onnx-coreml (empty = no ONNX backends)
        default: "1.30.0"
        required: false

permissions:
  contents: write  # only used to attach the .ipa to a release on v* tags

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LC0_REF: ${{ inputs.lc0_ref || 'release/0.33' }}
      ORT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ort_version || '1.30.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pip3 install --break-system-packages meson ninja
          brew install xcodegen
          xcodebuild -version

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            build/onnxruntime-*
            build/lc0/subprojects/packagecache
          key: deps-${{ env.LC0_REF }}-${{ env.ORT_VERSION }}-${{ hashFiles('patches/**', 'scripts/build_lc0.sh') }}

      - name: Build lc0 for iOS
        run: bash scripts/build_lc0.sh

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: app
        run: |
          set +e
          xcodebuild \
            -project LeelaBench.xcodeproj \
            -scheme LeelaBench \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          status=$?
          # Logs need a sign-in on GitHub; annotations don't, so surface errors there.
          grep -E "error:|Undefined symbols|referenced from|ld: " "$RUNNER_TEMP/xcodebuild.log" \
            | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          grep -A2 "duplicate symbol" "$RUNNER_TEMP/xcodebuild.log" | head -24 \
            | tr '\n' ' ' | sed 's/--/\n/g' | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          tail -5 "$RUNNER_TEMP/xcodebuild.log"
          exit $status

      - name: Check backends are linked in
        run: |
          set +e
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/LeelaBench.app"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          echo "::notice::app binary $(stat -f%z "$BIN") bytes; liblc0.a $(stat -f%z app/Vendor/lib/liblc0.a) bytes; $(grep LC0_ONNX app/Vendor/lc0.xcconfig)"
          strings -a "$BIN" > "$RUNNER_TEMP/strings.txt"
          missing=""
          for backend in metal blas eigen onnx-coreml; do
            grep -qx -- "$backend" "$RUNNER_TEMP/strings.txt" || missing="$missing $backend"
          done
          if [ -n "$missing" ]; then
            echo "::error::backends missing from app binary:$missing"
            exit 1
          fi
          echo "::notice::all backends present"

      - name: Package .ipa
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/LeelaBench.app"
          mkdir -p dist/plain/Payload dist/bigmem/Payload
          cp -R "$APP" dist/plain/Payload/
          (cd dist/plain && zip -qry ../LeelaBench.ipa Payload)
          # Same app, ad-hoc signed with the increased-memory-limit entitlement
          # so Sideloadly carries it over when re-signing.
          cp -R "$APP" dist/bigmem/Payload/
          codesign -f -s - --entitlements app/bigmem.entitlements dist/bigmem/Payload/LeelaBench.app
          codesign -d --entitlements - dist/bigmem/Payload/LeelaBench.app
          (cd dist/bigmem && zip -qry ../LeelaBench-bigmem.ipa Payload)
          ls -lh dist/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LeelaBench-ipa
          path: |
            dist/LeelaBench.ipa
            dist/LeelaBench-bigmem.ipa

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            build/meson/meson-logs/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LeelaBench.ipa
            dist/LeelaBench-bigmem.ipa
